version: '3.8'

services:
  api:
    build: .
    container_name: ms-api-mantenimientos
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=mantenimientos_db;Username=postgres;Password=BancoEcuador2026!
      - Jwt__Secret=BancoEcuadorSuperSecretKey2026MantenimientosEvolutivos!
      - Jwt__Issuer=MSApiMantenimientosEvolutivos
      - Jwt__Audience=BancoEcuador
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ms-api-postgres
    environment:
      POSTGRES_DB: mantenimientos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: BancoEcuador2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
